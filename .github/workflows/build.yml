name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>/dev/null | tail -1

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        id: build
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Show errors if failed
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -n "error:\|Error\|Exception\|FAILED\|cannot find" build.log | head -50
          echo "=== LAST 30 LINES ==="
          tail -30 build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename and upload APK
        if: success()
        run: mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/FANTER-Keyboard.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FANTER-Keyboard-APK
          path: out/FANTER-Keyboard.apk
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "FANTER Keyboard - دانلود APK"
          body: "کیبورد FANTER برای کلش اف کلنز"
          files: out/FANTER-Keyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
