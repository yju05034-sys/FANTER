name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>/dev/null | tail -1

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/FANTER-Keyboard.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FANTER-Keyboard
          path: output/FANTER-Keyboard.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FANTER Keyboard - دانلود APK"
          body: |
            ## کیبورد FANTER برای کلش اف کلنز
            
            **نصب:**
            فایل `FANTER-Keyboard.apk` را دانلود کنید و نصب کنید.
            
            **ویژگی‌ها:**
            - ارسال خودکار متن در چت کلش
            - دکمه شناور روشن/خاموش
            - دکمه تعویض کیبورد
            - دکمه مخفی‌سازی
          files: output/FANTER-Keyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
