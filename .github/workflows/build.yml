name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>/dev/null | tail -1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --info 2>&1 | tee build_output.txt || true
          echo "=== ERRORS ==="
          grep -i "error\|exception\|failed" build_output.txt | head -40 || true
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK found"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build_output.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FANTER-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0
          name: "FANTER Keyboard v1.0"
          body: "کیبورد FANTER برای کلش اف کلنز"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
