name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>/dev/null | tail -1

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Find and upload APK
        run: |
          echo "=== APK files found ==="
          find . -name "*.apk" 2>/dev/null
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/FANTER-Keyboard.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FANTER-Keyboard-APK
          path: out/FANTER-Keyboard.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "FANTER Keyboard - دانلود APK"
          body: |
            ## ⚔️ کیبورد FANTER برای کلش اف کلنز
            فایل `FANTER-Keyboard.apk` را دانلود و نصب کنید.
          files: out/FANTER-Keyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
